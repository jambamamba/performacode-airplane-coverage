<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffcdd2" stroke-width="4"/>
    </pattern>
  </defs>

  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#263238">The key trick: poke right next to every fence</text>

  <!-- frame -->
  <rect x="70" y="70" width="500" height="500" fill="none" stroke="#455a64" stroke-width="2"/>
  <!-- unseen side (hatched) -->
  <rect x="70" y="70" width="500" height="260" fill="url(#hatch)"/>
  <!-- seen side -->
  <rect x="70" y="330" width="500" height="240" fill="#a5d6a7" opacity="0.5"/>

  <!-- fence -->
  <line x1="70" y1="330" x2="570" y2="330" stroke="#c62828" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="80" y="316" font-size="13" fill="#b71c1c">one fence piece — here, the edge of a seen band</text>

  <text x="80" y="100" font-size="14" font-weight="bold" fill="#b71c1c">UNSEEN side (the hole)</text>
  <text x="80" y="556" font-size="14" font-weight="bold" fill="#1b5e20">SEEN side</text>

  <!-- midpoint -->
  <circle cx="320" cy="330" r="5" fill="#212121"/>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#212121">middle of the piece</text>

  <!-- poke up -->
  <line x1="320" y1="322" x2="320" y2="266" stroke="#37474f" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="320" cy="254" r="6" fill="#c62828"/>
  <text x="334" y="250" font-size="13" fill="#b71c1c">poke up: lands in the hole → UNSEEN → print it!</text>

  <!-- poke down -->
  <line x1="320" y1="338" x2="320" y2="394" stroke="#37474f" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="320" cy="406" r="6" fill="#2e7d32"/>
  <text x="334" y="410" font-size="13" fill="#1b5e20">poke down: lands on seen ground ✓</text>

  <!-- epsilon note -->
  <text x="86" y="212" font-size="12.5" fill="#37474f">we poke a hair to the side:</text>
  <text x="86" y="230" font-size="12.5" fill="#37474f">ε = 0.0001 km (10 cm) —</text>
  <text x="86" y="248" font-size="12.5" fill="#37474f">exaggerated in this picture</text>

  <!-- note box -->
  <rect x="70" y="588" width="500" height="66" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1"/>
  <text x="82" y="610" font-size="13" fill="#37474f">Why not test the middle of the piece itself? Because the fence sits exactly 50 km from a</text>
  <text x="82" y="628" font-size="13" fill="#37474f">flight — and exactly-50 km counts as SEEN. The fence always looks "covered", even with a huge</text>
  <text x="82" y="646" font-size="13" fill="#37474f">hole right behind it. So we always peek just past it — on both sides.</text>

  <text x="330" y="678" text-anchor="middle" font-size="14" fill="#37474f">One poke per side, for every piece. Every poke "seen" → no hole exists → OK. One poke "unseen" → print it.</text>
</svg>
